name: Build PosicionNK.exe

on:
  push:
    branches: [ "claude/zealous-hawking-gczrip" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name "PosicionNK" lanzador.py

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PosicionNK — Última versión"
          body: |
            ## Posición de Híbridos NK

            Doble clic en **PosicionNK.exe** para abrir la app.
            No requiere instalación de ningún programa.

            **Cómo usar:**
            1. Descargá `PosicionNK.exe`
            2. Doble clic → se abre la app en el navegador
            3. Cargá los archivos Excel de Girasol o Maíz
          files: dist/PosicionNK.exe
          prerelease: false
