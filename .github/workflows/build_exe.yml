name: Build PosicionNK.exe

on:
  push:
    branches: [ "claude/zealous-hawking-gczrip" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name "PosicionNK" lanzador.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosicionNK-exe
          path: dist/PosicionNK.exe
          retention-days: 30
